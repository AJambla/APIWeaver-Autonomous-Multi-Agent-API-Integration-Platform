server {
  # 8080, the port `nginxinc/nginx-unprivileged` is built around (its own default.conf listens
  # 8080), so this file follows the image rather than a runtime sysctl (`audit M10`). Binding 80
  # as uid 101 does happen to work under this Docker engine, which sets
  # net.ipv4.ip_unprivileged_port_start=0, but that is the engine's choice, not a guarantee.
  # Compose maps 3000:8080, so nothing outside this file changes.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The API accepts uploads up to MAX_UPLOAD_BYTES (50 MB by default); nginx's 1 MB default
  # turned larger specs into a bare 413 HTML page.
  client_max_body_size 50m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Security headers (`audit M7`).
  #
  # Firebase Auth requires connect-src/frame-src/script-src to Google & Firebase endpoints,
  # and Google user avatars require img-src to googleusercontent.com.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; base-uri 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header X-Content-Type-Options "nosniff" always;
  # Redundant with `frame-ancestors 'none'`, kept for browsers and proxies that still read it.
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  # Ignored by browsers over plaintext HTTP, so this costs nothing until TLS is terminated in
  # front of this server (`Deployment.md`) and is already in force when it happens.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Caching uses `expires`, not `add_header`: an `add_header` inside a location would
  # silently drop every security header declared above for that location.
  location /api/v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events: stream as produced and keep idle streams open.
    proxy_buffering off;
    proxy_read_timeout 1h;
    expires off;
  }

  # Vite emits content-hashed file names, so these never change under the same URL.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # index.html must be revalidated so a deploy is picked up immediately.
    expires -1;
  }
}
