server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (`audit M7`).
  #
  # `script-src 'self'` is the point of the whole policy, and it is only reachable because
  # the Monaco runtime is served from this origin (`src/lib/monaco.ts` +
  # `scripts/copy-monaco.mjs`) instead of cdn.jsdelivr.net. Any third-party script here can
  # read the access and refresh tokens out of `sessionStorage`, so nothing may be added to
  # this directive without re-earning that trust.
  #
  # `'unsafe-inline'` in `style-src` is required: Monaco and recharts write style attributes
  # and inject <style> nodes. It permits styling, not scripting.
  #
  # The three external origins are the ones this page actually loads: the Google Fonts
  # stylesheet and font files referenced by index.html, and the CloudFront video asset on
  # the landing page.
  #
  # `data:` in `font-src` and `blob:` in `worker-src` are both Monaco, measured in a browser:
  # it registers the codicon glyph font as an inline base64 FontFace, and its worker bootstrap
  # wraps every language worker in a `blob:` URL. Neither reaches the network, and neither can
  # be removed without patching vendor code — Monaco's AMD worker entries do not speak the
  # protocol the main thread expects in 0.56, so a same-origin worker file gets no replies.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; base-uri 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # Redundant with `frame-ancestors 'none'`, kept for browsers and proxies that still read it.
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  # Ignored by browsers over plaintext HTTP, so this costs nothing until TLS is terminated in
  # front of this server (`Deployment.md`) and is already in force when it happens.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
