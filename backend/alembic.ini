[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Zero-padded, ordered revision filenames so `ls alembic/versions` reads chronologically.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately absent — env.py reads DATABASE_URL through Settings so
# there is exactly one source of truth for the connection string, and no credential
# ever lands in a checked-in config file (Security.md §7).

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
