[tool.poetry]
name = "apiweaver-backend"
version = "0.1.0"
description = "APIWeaver FastAPI backend"
authors = ["APIWeaver Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.6.0"
pyjwt = { extras = ["crypto"], version = "^2.10.0" }
argon2-cffi = "^23.1.0"
redis = { extras = ["hiredis"], version = "^5.2.0" }
httpx = "^0.28.0"
structlog = "^24.4.0"
python-multipart = "^0.0.17"
boto3 = "^1.35.0"
pyyaml = "^6.0.2"
celery = { extras = ["redis"], version = "^5.4.0" }
flower = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL instance (partitioned DDL is Postgres-only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision identifiers are module-level lowercase strings by convention.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
# Migration scripts are procedural DDL, not typed application code.
module = "alembic.*"
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
