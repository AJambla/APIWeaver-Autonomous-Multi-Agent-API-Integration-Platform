# ==============================================================================
# Nginx Reverse Proxy & SSL Configuration for APIWeaver
# ==============================================================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge Directory for Certbot Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Healthcheck endpoints (unthrottled for uptime probes)
    location ~ ^/(readyz|healthz)$ {
        proxy_pass http://api:8000;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/apiweaver/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apiweaver/privkey.pem;

    # SSL hardening (Mozilla Modern guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow up to 50MB for OpenAPI spec uploads
    client_max_body_size 50M;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Healthcheck endpoints (unthrottled for uptime probes)
    location ~ ^/(readyz|healthz)$ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Interactive Documentation & OpenAPI Schema
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api:8000;
    }

    # Real-time Server-Sent Events (SSE) streaming routes
    # Crucial: Buffering MUST be disabled or SSE events will not stream in real-time
    location ~ ^/api/v1/.*(runs/events|stream|logs) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API endpoints (with rate limiting protection)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Frontend Single Page Application (SPA)
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
