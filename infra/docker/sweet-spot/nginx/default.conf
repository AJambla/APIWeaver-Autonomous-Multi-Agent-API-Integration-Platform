# ==============================================================================
# Nginx Reverse Proxy & SSL Configuration for APIWeaver
# ==============================================================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow up to 50MB for OpenAPI spec uploads
    client_max_body_size 50M;

    # Standard Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ACME Challenge Directory for Certbot Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Healthcheck endpoints (unthrottled for uptime probes)
    location ~ ^/(readyz|healthz)$ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Interactive Documentation & OpenAPI Schema
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://api:8000;
    }

    # Real-time Server-Sent Events (SSE) streaming routes
    location ~ ^/api/v1/.*(runs/events|stream|logs) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API endpoints (with rate limiting protection)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React Frontend Single Page Application (SPA)
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
