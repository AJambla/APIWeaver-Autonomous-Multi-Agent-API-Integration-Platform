apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apiweaver.fullname" . }}-web
  labels:
    {{- include "apiweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "apiweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "apiweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: web
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.web.image.repository .Values.web.image.tag }}
          ports:
            - containerPort: {{ .Values.web.servicePort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "apiweaver.fullname" . }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
