apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apiweaver.fullname" . }}
  labels:
    {{- include "apiweaver.labels" . | nindent 4 }}
type: Opaque
# Production values should be injected via Vault Agent Injector or External Secrets Operator.
# Do not store real credentials in this manifest.
stringData:
  DATABASE_URL: "postgresql://user:pass@rds-host:5432/apiweaver"
  REDIS_URL: "redis://elasticache-host:6379/0"
  VAULT_TOKEN: "vault-root-token-placeholder"
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
    -----END PUBLIC KEY-----
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC...
    -----END PRIVATE KEY-----
  GITHUB_APP_ID: "123456"
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEpAIBAAKCAQEA...
    -----END RSA PRIVATE KEY-----
  GITHUB_APP_CLIENT_ID: "github-client-id-placeholder"
  GITHUB_APP_CLIENT_SECRET: "github-client-secret-placeholder"
  GITHUB_OAUTH_REDIRECT_URI: "https://apiweaver.dev/auth/github/callback"
  GITHUB_WEBHOOK_SECRET: "webhook-secret-placeholder"
