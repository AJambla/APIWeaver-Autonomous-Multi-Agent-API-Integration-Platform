name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only permissions across the workflow (audit M9).
# Specific jobs override permissions when publishing packages or security events.
permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apiweaver_test
          POSTGRES_USER: apiweaver
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://apiweaver:test@localhost:5432/apiweaver_test
      AUDIT_PG_TEST_URL: postgresql+asyncpg://apiweaver:test@localhost:5432/apiweaver_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry
        run: pip install "poetry==2.5.1"
      - name: Install Dependencies
        run: poetry install --no-interaction
      - name: Run Ruff Linter
        # The worker and scripts ship in images too; they were never linted.
        run: poetry run ruff check . ../agent_worker ../scripts
      - name: Run Mypy Typecheck
        # Enforced: `|| true` hid 83+ errors and could never fail a build.
        run: poetry run mypy app/ ../agent_worker
      - name: Apply Alembic Migrations To Postgres
        # Proves the migration chain applies cleanly to a real Postgres 16, which the
        # SQLite-backed unit suite cannot (partitioned tables, triggers, CHECKs).
        env:
          # Settings requires the paths; migrations never read the keys.
          JWT_PRIVATE_KEY_PATH: unused.pem
          JWT_PUBLIC_KEY_PATH: unused.pub
        run: poetry run alembic upgrade head && poetry run alembic downgrade base && poetry run alembic upgrade head
      - name: Run Pytest Test Suite
        # `--strict-markers` + a coverage floor so an empty or skipped run cannot pass.
        run: poetry run pytest --strict-markers --cov=app --cov-report=xml --cov-fail-under=70

  test-frontend:
    name: Frontend Tests & Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint Frontend
        run: npm run lint
      - name: Run Vitest Suite
        run: npm test
      - name: Build Frontend Bundle
        run: npm run build

  validate-infra:
    name: Infrastructure & Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"
      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
      - name: Validate Docker Compose Configs
        run: |
          docker compose -f infra/docker/docker-compose.single-node.yml config -q
          docker compose -f infra/docker/docker-compose.dev.yml config -q

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  build-and-push-images:
    name: Build & Push Container (${{ matrix.name }})
    needs: [test-backend, test-frontend, validate-infra, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: api
          - name: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: web
          - name: agent-worker
            context: .
            dockerfile: ./agent_worker/Dockerfile
            image: agent-worker
          - name: sandbox-python
            context: ./infra/docker
            dockerfile: ./infra/docker/Dockerfile.sandbox-python
            image: sandbox-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Normalize Repository Name (Lowercase for GHCR)
        id: repo
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO_LOWER }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.REPO_LOWER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
