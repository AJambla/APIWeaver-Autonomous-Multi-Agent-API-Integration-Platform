name: Build AMD64 Images & Deploy to Azure VM

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'agent_worker/**'
      - 'infra/docker/sweet-spot/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push AMD64 Container Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner for image tags
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # Build & Push API Image (linux/amd64 for Azure Standard_B2als_v2 AMD EPYC)
      # ------------------------------------------------------------------------
      - name: Build and push Backend API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/apiweaver-api:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/apiweaver-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Build & Push Agent Worker Image (linux/amd64)
      # Root context required by agent_worker/Dockerfile to import backend code
      # ------------------------------------------------------------------------
      - name: Build and push Agent Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/apiweaver-agent-worker:latest
            ${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/apiweaver-agent-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure-vm:
    name: Deploy to Azure VM via Run Command
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Dispatch update to Azure VM via Run Command
        run: |
          VM_NAME="${{ secrets.AZURE_VM_NAME || 'vm-apiweaver-production' }}"
          RG_NAME="${{ secrets.AZURE_RESOURCE_GROUP || 'rg-apiweaver-production' }}"

          echo "Deploying update to Azure VM: $VM_NAME (Resource Group: $RG_NAME)..."

          # Command executed remotely on the Azure VM host
          DEPLOY_CMD="cd /opt/apiweaver && \
            docker compose -f docker-compose.prod.yml pull api agent-worker && \
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head && \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans"

          az vm run-command invoke \
            --resource-group "$RG_NAME" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "$DEPLOY_CMD"

          echo "Deployment successfully executed on Azure VM!"
