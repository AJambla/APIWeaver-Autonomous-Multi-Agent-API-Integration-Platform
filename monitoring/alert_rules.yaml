groups:
  - name: apiweaver_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (route)
          /
          sum(rate(http_requests_total[5m])) by (route)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.route }}"
          description: "Error rate is {{ $value | humanizePercentage }} on route {{ $labels.route }} for 5 minutes."

      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total[10m]) > 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in 10 minutes."

      - alert: CeleryQueueDepthHigh
        expr: apiweaver_celery_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue depth is {{ $value }}"
          description: "Agent worker queue depth has been above 100 for 10 minutes."

      - alert: RDSStorageHigh
        expr: |
          aws_rds_database_free_storage / aws_rds_database_allocated_storage * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RDS storage usage is above 80%"
          description: "RDS instance {{ $labels.DBInstanceIdentifier }} has less than 20% free storage."

      - alert: FailedWorkflowRateHigh
        expr: |
          sum(rate(apiweaver_workflow_runs_total{status="failed"}[30m]))
          /
          sum(rate(apiweaver_workflow_runs_total[30m]))
          > 0.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "High workflow failure rate"
          description: "{{ $value | humanizePercentage }} of workflows failed in the last 30 minutes."
