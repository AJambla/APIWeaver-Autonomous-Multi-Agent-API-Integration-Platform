# API Weaver Single-Node Production/Development Deployment
# Architecture: Blueprint §6 (Zero-Vault AES-256-GCM), §7 (Artifact Storage), §10 (Phase 5)
# Single command launch: docker compose up

services:
  init-bootstrap:
    image: python:3.12-slim
    volumes:
      - ./secrets:/app/secrets
      - ./.env:/app/.env
      - ./storage:/app/storage
      - ./scripts:/app/scripts
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir cryptography && python scripts/bootstrap.py"
    restart: "no"
    networks:
      - apiweaver

  postgres:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    container_name: apiweaver-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apiweaver}
      POSTGRES_USER: ${POSTGRES_USER:-apiweaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiweaver}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - apiweaver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-apiweaver} -d $${POSTGRES_DB:-apiweaver}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: apiweaver-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - apiweaver
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    container_name: apiweaver-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
      - ./scripts/qdrant-healthcheck.sh:/qdrant-healthcheck.sh:ro
    networks:
      - apiweaver
    healthcheck:
      test: ["CMD", "/bin/bash", "/qdrant-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: apiweaver-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - apiweaver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - apiweaver
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb myminio/${S3_BUCKET_UPLOADS:-apiweaver-uploads} --ignore-existing &&
      mc mb myminio/${S3_BUCKET_ARTIFACTS:-apiweaver-artifacts} --ignore-existing &&
      echo 'MinIO buckets initialized successfully.'
      "
    restart: "no"

  db-migration:
    image: apiweaver/api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apiweaver}:${POSTGRES_PASSWORD:-apiweaver}@postgres:5432/${POSTGRES_DB:-apiweaver}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      init-bootstrap:
        condition: service_completed_successfully
    networks:
      - apiweaver
    restart: "no"

  api:
    image: apiweaver/api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./secrets:/app/secrets:ro
      - ./storage:/app/storage
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apiweaver}:${POSTGRES_PASSWORD:-apiweaver}@postgres:5432/${POSTGRES_DB:-apiweaver}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
    networks:
      - apiweaver
    healthcheck:
      test: [ "CMD", "python", "-c", 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=10)' ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

  agent-worker:
    image: apiweaver/agent-worker:latest
    build:
      context: .
      dockerfile: agent_worker/Dockerfile
    volumes:
      - ./secrets:/app/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./storage:/app/storage
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apiweaver}:${POSTGRES_PASSWORD:-apiweaver}@postgres:5432/${POSTGRES_DB:-apiweaver}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      WORKER_METRICS_PORT: "9808"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully
    networks:
      - apiweaver
    command: celery -A agent_worker.celery_app worker --loglevel=info --concurrency=4 -Q celery,dlq
    stop_grace_period: 2m

  web:
    image: apiweaver/web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - apiweaver
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/" ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  apiweaver:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
